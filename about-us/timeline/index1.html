<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ZR1 Timeline</title>

    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at center, #0b2c33, #021417);
            color: white;
            font-family: sans-serif;
            overflow: hidden;
        }

        .rz-timeline {
            display: grid;
            grid-template-columns: 300px 1fr;
            height: 100vh;
        }

        /* LEFT NAV */
        .rz-nav {
            position: relative;
            z-index: 10;
            background: #021417;
            /* chặn slider phía sau */
        }

        .rz-nav li {
            list-style: none;
            margin: 20px 0;
            opacity: 0.3;
            cursor: pointer;
            transition: 0.3s;
        }

        .rz-nav li.active {
            opacity: 1;
            transform: translateX(10px);
        }

        /* SLIDER */
        .rz-slider {
            perspective: 1400px;
            overflow: hidden;
            position: relative;

        }

        .rz-slider::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 150px;
            height: 100%;
            background: linear-gradient(to right, #021417, transparent);
            z-index: 2;
        }

        .rz-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .rz-bg-track {
            position: absolute;
            top: 50%;
            left: 50%;
            display: flex;
            gap: 100px;
            transform: translate(-50%, -50%);
        }

        .rz-track {
            position: absolute;
            top: 50%;
            left: 0;
            /* 🔥 QUAN TRỌNG */
            transform: translateY(-50%);
            display: flex;
            gap: 100px;
        }

        /* CARD */
        .rz-bg-card {
            width: 500px;
            height: 300px;
            flex-shrink: 0;

            opacity: 0.25;
            filter: blur(10px);
            transform: scale(0.9);

            transition: 0.6s;
        }

        .rz-bg-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rz-card {
            width: 900px;
            height: 520px;
            flex-shrink: 0;
        }

        .rz-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ACTIVE CENTER */


        /* POPUP */
        .rz-popup {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .rz-popup.active {
            display: flex;
        }

        .rz-popup__content {
            width: 80%;
            display: flex;
            gap: 40px;
        }

        .rz-popup img {
            width: 60%;
        }

        .close {
            position: absolute;
            top: 40px;
            right: 40px;
            font-size: 40px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <section class="rz-timeline">

        <!-- LEFT NAV -->
        <div class="rz-nav">
            <ul>
                <li class="active" data-index="0">2006-2007</li>
                <li data-index="1">2008</li>
                <li data-index="2">2011</li>
                <li data-index="3">2012</li>
                <li data-index="4">2013</li>
            </ul>
        </div>

        <!-- CENTER SLIDER -->
        <div class="rz-slider">

            <div class="rz-bg">
                <div class="rz-bg-track"></div>
            </div>

            <div class="rz-track">

                <div class="rz-card active" data-index="0">
                    <img
                        src="https://static.vecteezy.com/system/resources/thumbnails/057/068/323/small/single-fresh-red-strawberry-on-table-green-background-food-fruit-sweet-macro-juicy-plant-image-photo.jpg">
                    <div class="c-timeline-item__inner-content">
                        <div class="c-timeline-item__title u-a3">The garage phase</div>
                        <div class="c-timeline-item__year u-a1">2008</div>
                    </div>
                </div>

                <div class="rz-card" data-index="1">
                    <img src="https://www.topgear.com/sites/default/files/2024/08/NEVERA_R_ROAD_5.jpg">
                    <div class="c-timeline-item__inner-content">
                        <div class="c-timeline-item__title u-a3">The garage phase</div>
                        <div class="c-timeline-item__year u-a1">2009</div>
                    </div>
                </div>

                <div class="rz-card" data-index="2">
                    <img src="https://hips.hearstapps.com/hmg-prod/images/2025-rimac-nevera-pr-101-691b428773e01.jpg">
                    <div class="c-timeline-item__inner-content">
                        <div class="c-timeline-item__title u-a3">The garage phase</div>
                        <div class="c-timeline-item__year u-a1">2010</div>
                    </div>
                </div>

                <div class="rz-card" data-index="3">
                    <img src="https://hips.hearstapps.com/hmg-prod/images/2025-rimac-nevera-pr-101-691b428773e01.jpg">
                    <div class="c-timeline-item__inner-content">
                        <div class="c-timeline-item__title u-a3">The garage phase</div>
                        <div class="c-timeline-item__year u-a1">2011</div>
                    </div>
                </div>

                <div class="rz-card" data-index="4">
                    <img src="https://hips.hearstapps.com/hmg-prod/images/2025-rimac-nevera-pr-101-691b428773e01.jpg">
                    <div class="c-timeline-item__inner-content">
                        <div class="c-timeline-item__title u-a3">The garage phase</div>
                        <div class="c-timeline-item__year u-a1">2012</div>
                    </div>
                </div>

            </div>

        </div>

    </section>

    <!-- POPUP -->
    <div class="rz-popup">
        <div class="rz-popup__content">
            <span class="close">×</span>
            <img id="popup-img">
            <div class="text">
                <h2>Title</h2>
                <p>Description...</p>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>

    <script>

        gsap.registerPlugin(Draggable);

        const track = document.querySelector(".rz-track");
        const cards = document.querySelectorAll(".rz-card");
        const navItems = document.querySelectorAll(".rz-nav li");

        let cardWidth = 900;
        // const BASE_WIDTH = 800; // size cũ (lúc layout đẹp)
        let gap = 100;
        let current = 0;
        let isScrolling = false;

        /* NAV CLICK */
        navItems.forEach((item, i) => {
            item.addEventListener("click", () => snapTo(i));
        });
        const bgTrack = document.querySelector(".rz-bg-track");

        cards.forEach(card => {
            const clone = card.cloneNode(true);
            clone.classList.remove("rz-card");
            clone.classList.add("rz-bg-card");

            bgTrack.appendChild(clone);
        });
        const bgCards = document.querySelectorAll(".rz-bg-card");

        /* CALC POSITION */
        const navWidth = 300;
        function getX(index) {
            const center = navWidth + (window.innerWidth - navWidth) / 2;

            return center - (cardWidth / 2) - index * (cardWidth + gap);
        }

        /* UPDATE UI */
        function setActive(index) {
            current = index;

            navItems.forEach(n => n.classList.remove("active"));
            navItems[index].classList.add("active");

            updateCards();
        }

        /* DIAGONAL ANIMATION 🔥 */
        function updateCards() {
            const maxX = window.innerWidth * 0.35;
            const maxY = window.innerHeight * 0.25;

            cards.forEach((card, i) => {
                let offset = i - current;
                let abs = Math.abs(offset);

                // 🔥 clamp để không vượt màn hình
                let x = Math.min(abs * 220, maxX);
                let y = Math.min(abs * 140, maxY);

                if (offset === 0) {
                    gsap.to(card, {
                        x: 0,
                        y: 0,
                        scale: 1,
                        rotateY: 0,
                        opacity: 1,
                        filter: "blur(0px)",
                        zIndex: 10,
                        duration: 0.6,
                        ease: "power3.out"
                    });
                }

                else if (offset < 0) {
                    // LEFT TOP
                    gsap.to(card, {
                        x: -x,
                        y: -y,
                        scale: Math.max(0.6, 1 - abs * 0.15),
                        rotateY: 45,
                        opacity: Math.max(0.2, 1 - abs * 0.25),
                        filter: `blur(${Math.min(abs * 2, 6)}px)`,
                        zIndex: 10 - abs,
                        duration: 0.6,
                        ease: "power3.out"
                    });
                }

                else {
                    // RIGHT BOTTOM
                    gsap.to(card, {
                        x: x,
                        y: y,
                        scale: Math.max(0.6, 1 - abs * 0.15),
                        rotateY: -45,
                        opacity: Math.max(0.2, 1 - abs * 0.25),
                        filter: `blur(${Math.min(abs * 2, 6)}px)`,
                        zIndex: 10 - abs,
                        duration: 0.6,
                        ease: "power3.out"
                    });
                }
            });
            bgCards.forEach((card, i) => {
                let offset = i - current;
                let abs = Math.abs(offset);

                // ❌ quá xa thì ẩn
                if (abs > 2) {
                    gsap.to(card, { opacity: 0 });
                    return;
                }

                // 🔥 khoảng cách NHỎ lại (rất quan trọng)
                let x = abs * 120;
                let y = abs * 70;

                if (offset === 0) {
                    // center bg (nằm ngay sau card chính)
                    gsap.to(card, {
                        x: 0,
                        y: 0,
                        scale: 1,
                        opacity: 0.3,
                        filter: "blur(8px)",
                        zIndex: 1,
                        duration: 0.7
                    });
                }
                else if (offset < 0) {
                    // LEFT TOP
                    gsap.to(card, {
                        x: -x,
                        y: -y,
                        scale: 0.85,
                        opacity: 0.2,
                        filter: "blur(10px)",
                        zIndex: 0,
                        duration: 0.7
                    });
                }
                else {
                    // RIGHT BOTTOM
                    gsap.to(card, {
                        x: x,
                        y: y,
                        scale: 0.85,
                        opacity: 0.2,
                        filter: "blur(10px)",
                        zIndex: 0,
                        duration: 0.7
                    });
                }
            });
        }
        /* SNAP */
        function snapTo(index) {
            let x = getX(index);

            gsap.to(track, {
                x: x,
                duration: 0.45,
                ease: "power2.out"
            });

            setActive(index);
            draggable[0].update();
        }

        /* REALTIME SYNC */
        function updateByPosition(x) {
            let index = Math.round(
                (getX(0) - x) / (cardWidth + gap)
            );

            index = Math.max(0, Math.min(cards.length - 1, index));

            setActive(index);
        }

        /* DRAG */
        const draggable = Draggable.create(track, {
            type: "x",
            inertia: true,
            edgeResistance: 0.85, // 🔥 mượt hơn
            bounds: {
                minX: getX(cards.length - 1),
                maxX: getX(0)
            },

            onDrag() {
                updateByPosition(this.x);
            },

            onThrowUpdate() {
                updateByPosition(this.x);
            },

            onDragEnd() {
                let index = Math.round(
                    (getX(0) - this.x) / (cardWidth + gap)
                );

                index = Math.max(0, Math.min(cards.length - 1, index));

                snapTo(index);
            }
        });

        document.querySelector(".rz-slider").addEventListener("wheel", (e) => {
            e.preventDefault();

            if (isScrolling) return; // 🔥 chống spam

            isScrolling = true;

            if (e.deltaY > 0) {
                // scroll xuống → next
                current = Math.min(current + 1, cards.length - 1);
            } else {
                // scroll lên → prev
                current = Math.max(current - 1, 0);
            }

            snapTo(current);

            // delay để tạo cảm giác inertia
            setTimeout(() => {
                isScrolling = false;
            }, 600);
        }, { passive: false });

        /* INIT */
        snapTo(0);


    </script>

</body>

</html>
